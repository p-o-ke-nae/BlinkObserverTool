name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_OWNER: ${{ vars.GENERIC_RECOGNITION_PACKAGE_OWNER || github.repository_owner }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag and HEAD
        id: version
        shell: pwsh
        run: |
          $resolved = .\build\Resolve-GitVersion.ps1 `
            -RepositoryPath . `
            -Configuration Release `
            -OutputFormat Json | ConvertFrom-Json
          $expectedTag = "v$($resolved.MsiVersion)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Workflow tag '$env:GITHUB_REF_NAME' does not match resolved HEAD tag '$expectedTag'."
          }
          "version=$($resolved.MsiVersion)" >> $env:GITHUB_OUTPUT

      - name: Configure GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $configPath = (Resolve-Path .\NuGet.Config).Path
          [xml]$config = Get-Content -LiteralPath $configPath -Raw
          $sourcesToRemove = @(
            $config.configuration.packageSources.add |
              Where-Object {
                $_.key -in @("LocalPackages", "GitHubPackages", "github") -or
                $_.value -like "https://nuget.pkg.github.com/*"
              }
          )
          foreach ($source in $sourcesToRemove) {
            [void]$source.ParentNode.RemoveChild($source)
          }
          $config.Save($configPath)

          dotnet nuget add source "https://nuget.pkg.github.com/$env:PACKAGE_OWNER/index.json" `
            --name github `
            --username "$env:GITHUB_ACTOR" `
            --password "$env:GITHUB_TOKEN" `
            --store-password-in-clear-text `
            --valid-authentication-types basic `
            --configfile .\NuGet.Config

      - name: Restore
        shell: pwsh
        run: dotnet restore .\BlinkObserverTool.slnx --configfile .\NuGet.Config

      - name: Test version resolver
        shell: pwsh
        run: .\build\tests\Resolve-GitVersion.Tests.ps1

      - name: Test profile synchronization
        shell: pwsh
        run: dotnet test .\BlinkObserverTool.ProfileSync.Tests\BlinkObserverTool.ProfileSync.Tests.csproj -c Release --no-restore

      - name: Test blink recognition
        shell: pwsh
        run: dotnet test .\BlinkObserverTool.BlinkRecognition.Tests\BlinkObserverTool.BlinkRecognition.Tests.csproj -c Release --no-restore

      - name: Build Release MSI
        shell: pwsh
        run: dotnet build .\installer\BlinkObserverTool.Installer\BlinkObserverTool.Installer.wixproj -c Release --no-restore

      - name: Validate MSI contents
        id: msi
        shell: pwsh
        run: |
          $msi = Resolve-Path .\installer\BlinkObserverTool.Installer\bin\Release\BlinkObserverTool.Installer.msi
          $settings = Get-Content .\installer\BlinkObserverTool.Installer\installer.settings.json -Raw | ConvertFrom-Json
          .\build\Test-MsiPackage.ps1 `
            -MsiPath $msi `
            -ExpectedVersion "${{ steps.version.outputs.version }}" `
            -ExpectedUpgradeCode $settings.UpgradeCode `
            -MainExecutableName $settings.MainExecutableName `
            -RequiredFileNames @("manifest.json", "profile.json", "template.png")
          "path=$msi" >> $env:GITHUB_OUTPUT

      - name: Create SHA-256 checksum
        id: checksum
        shell: pwsh
        run: |
          $msi = "${{ steps.msi.outputs.path }}"
          $checksumPath = "$msi.sha256"
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            $checksumPath,
            "$hash  $([System.IO.Path]::GetFileName($msi))`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          "path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Remove package credentials
        if: always()
        shell: pwsh
        run: |
          dotnet nuget remove source github --configfile .\NuGet.Config
          if ($LASTEXITCODE -ne 0) {
            Write-Host "The transient github source was not present."
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "${{ steps.msi.outputs.path }}" `
            "${{ steps.checksum.outputs.path }}" `
            --verify-tag `
            --title "BlinkObserverTool $env:GITHUB_REF_NAME" `
            --generate-notes
