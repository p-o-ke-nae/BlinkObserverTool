<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BlinkObserverTool の機能概要</title>
  <desc id="desc">映像入力、瞬き認識、キー送信の流れを示す図</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8f2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#23395d" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <text x="80" y="92" fill="#17233c" font-family="Segoe UI, sans-serif" font-size="46" font-weight="700">BlinkObserverTool</text>
  <text x="82" y="136" fill="#4a5a78" font-family="Segoe UI, sans-serif" font-size="24">映像から瞬きを検出し、観測操作を支援する Windows アプリ</text>
  <g filter="url(#shadow)">
    <rect x="75" y="205" width="280" height="250" rx="24" fill="#ffffff"/>
    <rect x="460" y="205" width="280" height="250" rx="24" fill="#ffffff"/>
    <rect x="845" y="205" width="280" height="250" rx="24" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#4666d5" stroke-width="12" stroke-linecap="round">
    <path d="M365 330h75"/>
    <path d="M750 330h75"/>
  </g>
  <g fill="#4666d5">
    <path d="m430 306 30 24-30 24z"/>
    <path d="m815 306 30 24-30 24z"/>
  </g>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <text x="215" y="267" fill="#4666d5" font-size="62">▣</text>
    <text x="215" y="350" fill="#17233c" font-size="30" font-weight="700">映像入力</text>
    <text x="215" y="397" fill="#5c6983" font-size="21">カメラ・観測範囲</text>
    <text x="600" y="267" fill="#7b4bc4" font-size="62">◉</text>
    <text x="600" y="350" fill="#17233c" font-size="30" font-weight="700">瞬き認識</text>
    <text x="600" y="397" fill="#5c6983" font-size="21">テンプレート・特徴</text>
    <text x="985" y="267" fill="#16856b" font-size="62">⌨</text>
    <text x="985" y="350" fill="#17233c" font-size="30" font-weight="700">操作支援</text>
    <text x="985" y="397" fill="#5c6983" font-size="21">指定先へキー送信</text>
  </g>
  <rect x="75" y="505" width="1050" height="66" rx="20" fill="#17233c"/>
  <text x="600" y="548" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22" text-anchor="middle">Windows 10 / 11 ・ x64 ・ self-contained MSI ・ 検証モード対応</text>
</svg>
